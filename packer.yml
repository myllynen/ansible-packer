---
- name: Build image with Packer
  hosts: all
  vars:
    #
    # Base configuration
    #
    packer_binary: packer
    packer_builder: qemu
    packer_target: rhel_10
    image_name: packer_image.qcow2

    vm_type: uefi-secure
    vm_tpm: true
    vm_cpus: 4
    vm_memory: 8192
    vm_disk_size: 30720
    vm_disk_interface: virtio-scsi

    # Packer VM installation timeout
    shutdown_period: 15m

    # Build options
    do_cleanup: true
    use_force: false

    #
    # OS configuration
    #
    boot_password: "{{ image_password }}"
    root_password: "{{ image_password }}"

    # Autopartitioning does not support
    # creating BIOS/UEFI-compatible images
    bios_uefi_boot: true
    # One of: auto/custom/default/single
    partitioning: default

    disable_ipv6: true
    selinux: enforcing
    #fips_enable: true
    # NB. Not supported on RHEL 10+
    #security_profile: cis
    boot_parameters: net.ifnames.prefix=net quiet
    serial_console_setup: true

    hostname: localhost.localdomain
    ntp_servers: time.cloudflare.com
    timezone: Europe/Helsinki
    keyboard: fi

    create_admin: true
    admin_user:
      uid: 4444
      gid: 4444
      name: admin
      group: admin
      groups: wheel
      home: /home/admin
      gecos: Admin User
      #ssh_key: ssh-ed25519 ... admin@image
      passwordless_sudo: true

    root_permit_local: true
    root_permit_ssh: "prohibit-password"
    # NB. Not supported on RHEL 10+
    root_permit_override_security_policy: false
    #root_ssh_key: ssh-ed25519 ... root@image

    #custom_partitioning: |
    #  reqpart
    #  part /boot    --fstype xfs      --size 1024 --grow
    #  part /        --fstype xfs      --size 1024 --grow
    #  part swap     --fstype swap     --size 2048

    #custom_packages: |
    #  cloud-init
    #  cloud-utils-growpart
    #  insights-client
    #  rhc
    #  rhc-worker-playbook
    #  sos
    #  unzip
    #  zsh

    #custom_section_early: |
    #  %post --erroronfail
    #  cat /etc/resolv.conf > /var/tmp/.inst-resolv-conf
    #  %end

    #custom_section_late: |
    #  %post --erroronfail
    #  touch /.unconfigured
    #  %end

    #
    # Builder configurations
    #

    # Builder: qemu
    # https://developer.hashicorp.com/packer/integrations/hashicorp/qemu/latest/components/builder/qemu
    #qemu_binary: /usr/bin/qemu-system-x86_64
    qemu_binary: /usr/libexec/qemu-kvm
    output_directory: /var/tmp/packer_images

    # Builder: vmware
    # https://developer.hashicorp.com/packer/integrations/vmware/vsphere/latest/components/builder/vsphere-iso
    # These should come from vault
    #vcenter_credentials:
    #  vcenter_server: vcenter.example.com
    #  vcenter_username: vcuser
    #  vcenter_password: vcpass
    vcenter_insecure_connection: true
    vcenter_datacenter: DC1
    vcenter_folder: Linux/templates
    # https://developer.hashicorp.com/packer/integrations/vmware/vsphere/latest/components/builder/vsphere-iso#working-with-clusters-and-hosts
    #vcenter_host: vcenter-host1.example.com
    vcenter_cluster: DC1-C1
    #vcenter_resource_pool: DC1-RP1
    vcenter_datastore: DC1-C1-LUN-1
    vcenter_network: DC1-C1-VLAN-123
    #vm_guest_os_type: rhel9_64Guest
    # https://developer.hashicorp.com/packer/integrations/vmware/vsphere/latest/components/builder/vsphere-iso#location-configuration
    vcenter_convert_to_template: true
    #vcenter_content_library:
    #  library: DC1-CL
    #  #name: cl-template
    #  ovf: false
    #  destroy: true

    #
    # OS installer configuration
    #
    iso:
      rhel_9:
        url: file:///VirtualMachines/boot/rhel-9.8-x86_64-dvd.iso
        checksum: "none"
      rhel_10:
        url: file:///VirtualMachines/boot/rhel-10.2-x86_64-dvd.iso
        checksum: "none"
      rhel_10_2:
        url: file:///VirtualMachines/boot/rhel-10.2-x86_64-dvd.iso
        checksum: "none"

    # The OS installer boot_command will be appended by boot_parameters and boot_start
    # RHEL-compatible boot_command on BIOS
    #boot_command: <up><wait><tab><wait> inst.ks=hd:/dev/sr1:/inst.cfg inst.geoloc=0 inst.nosave=all ip=dhcp
    # RHEL-compatible boot_command on UEFI
    boot_command: <up><wait>e<wait><down><down><leftCtrlOn>e<leftCtrlOff> inst.ks=cdrom:/inst.cfg inst.geoloc=0 inst.nosave=all ip=dhcp
    # NB. With RHEL on BIOS use '<enter>' to boot, on UEFI must use '<leftCtrlOn>x<leftCtrlOff>'
    boot_start: <leftCtrlOn>x<leftCtrlOff><wait>

  roles:
    - myllynen.ansible_packer.ansible_packer

  post_tasks:
    - name: Trim VM image
      vars:
        actual_image: "{{ output_directory + '/' + image_name }}"
      ansible.builtin.command: >
        virt-sparsify --in-place --quiet {{ actual_image }}
      changed_when: true
      when: packer_builder == 'qemu'

    - name: Rebase VM image
      vars:
        actual_image: "{{ output_directory + '/' + image_name }}"
        rebase_image: "{{ output_directory + '/rebase-' + image_name }}"
      ansible.builtin.shell: >
        qemu-img convert -O qcow2 {{ actual_image }} {{ rebase_image }} &&
          mv {{ rebase_image }} {{ actual_image }}
      changed_when: true
      when: packer_builder == 'qemu'
